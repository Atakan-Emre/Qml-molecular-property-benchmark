# Molecule Classical Training - Default Configuration
experiment_name: mol_classical
modality: molecule
task: binary

# Data
data_dir: ""  # auto-resolved
dataset_name: bace  # bace, bbbp, clintox
num_classes: 2

# Training
seeds: [0, 42, 123, 456, 789]
batch_size: 256
epochs: 100
lr: 0.001
weight_decay: 0.0001
optimizer: adam
scheduler: plateau
scheduler_patience: 5
scheduler_factor: 0.5

# Early Stopping
early_stopping: true
es_patience: 15
es_min_delta: 0.0001
es_monitor: val_loss

# Checkpointing
save_top_k: 3
save_predictions: true
save_embeddings: false

# Data regime ablation
data_fraction: 1.0

# Device
device: auto
num_workers: 8
pin_memory: true
persistent_workers: true
use_amp: true
