      function collectStops() {
        const doc = getFrameDocument();
        const frameWindow = getFrameWindow();
        if (!doc) return [];
        const sections = [...doc.querySelectorAll("main > section[id]")];
        const viewportHeight = frameWindow.innerHeight;
        const maxY = Math.max(0, doc.documentElement.scrollHeight - viewportHeight);

        return sections.map((section) => {
          const rect = section.getBoundingClientRect();
          const top = elementTop(section);
          const height = rect.height;
          const heading = section.querySelector("h1,h2,h3");
          const title = heading?.textContent?.trim() || section.id || "QML Semineri";
          const centeredTop = top - Math.max(0, viewportHeight - height) / 2;
          return {
            sectionId: section.id,
            title,
            targetY: Math.max(0, Math.min(maxY, centeredTop))
          };
        });
      }

      function refreshStops() {
        stops = collectStops();
        if (activeIndex >= stops.length) activeIndex = Math.max(0, stops.length - 1);
        auditSlides();
        updateStatus();
      }

      function auditSlides() {
        const doc = getFrameDocument();
        if (!doc) return;
        const audit = [...doc.querySelectorAll("main > section[id]")].map((section, index) => {
          const heading = section.querySelector("h1,h2,h3")?.textContent?.trim() || section.id;
          return {
            index: index + 1,
            id: section.id,
            title: heading,
            clientHeight: Math.round(section.clientHeight),
            scrollHeight: Math.round(section.scrollHeight),
            overflowY: Math.max(0, Math.round(section.scrollHeight - section.clientHeight))
          };
        });
        const overflows = audit.filter((item) => item.overflowY > 8);
        document.documentElement.dataset.qmlSlideCount = String(audit.length);
        document.documentElement.dataset.qmlOverflowCount = String(overflows.length);
        document.documentElement.dataset.qmlOverflowSlides = overflows.map((item) => `${item.index}:${item.id}:${item.overflowY}`).join("|");
      }

      function updateStatus() {
        const stop = stops[activeIndex];
        progressText.textContent = `${formatNumber(activeIndex + 1)} / ${formatNumber(Math.max(1, stops.length))}`;
        sectionText.textContent = stop?.title || "QML Semineri";
      }

      function goToStop(index) {
        if (!stops.length) refreshStops();
        if (!stops.length) return;
        const frameWindow = getFrameWindow();
        const doc = getFrameDocument();
        activeIndex = Math.max(0, Math.min(stops.length - 1, index));
        const stop = stops[activeIndex];
        const maxY = Math.max(0, doc.documentElement.scrollHeight - frameWindow.innerHeight);
        const targetY = Math.max(0, Math.min(maxY, stop.targetY));
        frameWindow.history.replaceState(null, "", `#${stop.sectionId}`);
        frameWindow.scrollTo({ top: targetY, behavior: "smooth" });
        updateStatus();
      }

      function move(direction) {
        if (locked) return;
        locked = true;
        refreshStops();
        goToStop(activeIndex + direction);
        window.setTimeout(() => {
          locked = false;
        }, 520);
      }

      function onKeydown(event) {
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        if (advanceKeys.has(event.key)) {
          event.preventDefault();
          move(1);
        } else if (reverseKeys.has(event.key)) {
          event.preventDefault();
          move(-1);
        } else if (event.key === "Home") {
          event.preventDefault();
          goToStop(0);
        } else if (event.key === "End") {
          event.preventDefault();
          refreshStops();
          goToStop(stops.length - 1);
        }
      }

      function onWheel(event) {
        event.preventDefault();
        const dominantDelta = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
        if (Math.abs(dominantDelta) < 8) return;
        move(dominantDelta > 0 ? 1 : -1);
      }

      function bindFrameControls() {
        const frameWindow = getFrameWindow();
        const doc = getFrameDocument();
        if (!frameWindow || !doc || frameWindow.__qmlPresentationControlsBound) return;
        frameWindow.__qmlPresentationControlsBound = true;
        frameWindow.addEventListener("keydown", onKeydown);
        frameWindow.addEventListener("wheel", onWheel, { passive: false });
        doc.addEventListener("keydown", onKeydown);
      }

      frame.addEventListener("load", () => {
        injectPresentationStyles();
        bindFrameControls();
        window.setTimeout(() => {
          refreshStops();
          goToStop(0);
        }, 700);
      });

      captureLayer.addEventListener("keydown", onKeydown);
      window.addEventListener("keydown", onKeydown);
      window.addEventListener("wheel", onWheel, { passive: false });
      window.addEventListener("resize", () => window.setTimeout(() => {
        refreshStops();
        goToStop(activeIndex);
      }, 120));
      previousButton.addEventListener("click", () => move(-1));
      nextButton.addEventListener("click", () => move(1));
      captureLayer.focus();
    })();
  </script>
</body>
</html>
